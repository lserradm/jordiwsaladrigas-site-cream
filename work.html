<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jordi W. Saladrigas — Work</title><link rel="stylesheet" href="styles.css?v=series-1"></head>
<body><header><div class="wrap nav"><a class="brand" href="index.html">JORDI W. SALADRIGAS<small>Artist</small></a><nav class="menu"><a href="index.html">Home</a><a href="bio.html">Bio</a><a href="selected-works.html" class="active">Works</a><a href="drawings.html">Drawings</a><a href="exhibitions.html">Exhibitions</a><a href="contact.html">Contact</a></nav></div></header>
<main class="wrap"><section class="section detail-head"><a class="back-link" href="selected-works.html">← Back to Works</a><h1 id="title">Work</h1><p class="sub" id="count"></p></section><section class="detail-grid" id="images"></section>
<dialog id="lb" onclick="if(event.target===this)this.close()"><button class="close" onclick="this.closest('dialog').close()">Close</button><div class="lightbox"><img id="lbimg" alt="Artwork"></div></dialog></main><footer><div class="wrap">© <span id="y"></span> Jordi W. Saladrigas. All rights reserved.</div></footer>
<script>
const groups={
'north-sentinel':['work116.jpg','work112.jpg'],
'el-dorado-ii':['work20-black.png','work20-detail.jpg'],
'el-dorado':['work24.jpg','work25.jpg','work30.jpg'],
'music-for-penguins':['work50.jpg','work51.jpg'],
'african-music-in-motion':['work53.jpg','work55.jpg'],
'scottish-winter':['work59.jpg','work60.jpg'],
'death-ii':['work66-black.jpg','work67.jpg'],
'cargo-ship':['work70.jpg','work74.jpg'],
'alvar-nunez':['work82.jpg','work86.jpg']
};
function openLightbox(img){const lb=document.getElementById('lb'),im=document.getElementById('lbimg');im.src=img.src;im.alt=img.alt||'Artwork';lb.showModal()}
async function init(){const id=new URLSearchParams(location.search).get('id'),files=groups[id];if(!files){document.getElementById('title').textContent='Work not found';document.getElementById('count').textContent='Return to the Works page to choose an artwork.';return}let titles={};try{const r=await fetch('assets/titles.json',{cache:'no-store'});if(r.ok)titles=await r.json()}catch(e){}const title=titles[files[0]]||'Untitled';document.title=title+' — Jordi W. Saladrigas';document.getElementById('title').textContent=title;document.getElementById('count').textContent=files.length+' images';const grid=document.getElementById('images');files.forEach((file,index)=>{const f=document.createElement('figure');f.className='detail-image';const img=document.createElement('img');img.src='assets/'+file;img.alt=title+(files.length>1?' — image '+(index+1):'');img.loading='lazy';img.onclick=()=>openLightbox(img);const c=document.createElement('figcaption');c.textContent=index===0?'Image 1':(id==='north-sentinel'&&index===1?'Reverse':'Image '+(index+1));f.append(img,c);grid.append(f)});document.getElementById('y').textContent=new Date().getFullYear()}
document.addEventListener('DOMContentLoaded',init)
</script></body></html>
