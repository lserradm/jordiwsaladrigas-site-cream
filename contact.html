<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jordi W. Saladrigas — Contact</title><link rel="stylesheet" href="styles.css?v=black-organized-1"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">JORDI W. SALADRIGAS<small>Artist</small></a><nav class="menu"><a href="index.html" class="">Home</a><a href="bio.html" class="">Bio</a><a href="selected-works.html" class="">Works</a><a href="exhibitions.html" class="">Exhibitions</a><a href="contact.html" class="active">Contact</a></nav></div></header><main class="wrap"><section class="section"><div class="card"><h2>Contact</h2><p>For enquiries, exhibitions and press, please write to:</p><p><a href="mailto:jordi.andaman@gmail.com">jordi.andaman@gmail.com</a></p></div></section></main><footer><div class="wrap">© <span id="y"></span> Jordi W. Saladrigas. All rights reserved.</div></footer><script>
async function applyTitles(){try{const r=await fetch('assets/titles.json',{cache:'no-store'});if(!r.ok)return;const m=await r.json();document.querySelectorAll('figure.tile').forEach(f=>{const i=f.querySelector('img'),c=f.querySelector('.cap');if(!i||!c)return;const k=(i.getAttribute('src')||'').split('/').pop();const t=m[k];if(t&&t.trim()){c.textContent=t;i.alt=t;}})}catch(e){console.log('titles.json not loaded',e)}}
function openLightbox(img){const lb=document.getElementById('lb'),im=document.getElementById('lbimg');im.src=img.src;im.alt=img.alt||'Work';lb.showModal();}
document.addEventListener('DOMContentLoaded',()=>{const y=document.getElementById('y');if(y)y.textContent=new Date().getFullYear();applyTitles();});
</script></body></html>
