<body><header><div class="wrap nav"><a class="brand" href="index.html">JORDI W. SALADRIGAS<small>Artist</small></a><nav class="menu"><a href="index.html">Home</a><a href="bio.html">Bio</a><a href="selected-works.html" class="active">Works</a><a href="exhibitions.html">Exhibitions</a><a href="contact.html">Contact</a></nav></div></header>
<main class="wrap" id="top"><section class="section"><div class="section-head"><div><h1>Works</h1><p class="sub">36 works, arranged in the artist’s chosen sequence.</p></div><a class="button" href="#drawings">View drawings ↓</a></div><div class="grid" id="works-grid"></div></section>

<dialog id="lb" onclick="if(event.target===this)this.close()"><button class="close" onclick="document.getElementById('lb').close()">Close</button><div class="lightbox"><img id="lbimg" alt="Artwork"></div></dialog></main><footer><div class="wrap">© <span id="y"></span> Jordi W. Saladrigas. All rights reserved.</div></footer>
<script>
const works=['work01.jpg','work02.jpg','work03.jpg','work07.jpg','work08.jpg','work09.jpg','work10.jpg','work11.jpg','work112.jpg','work13.jpg','work14.jpg','work15.jpg','work116.jpg','work17.jpg','work18.jpg','work19.jpg','work20.jpg','work21.jpg','work22.jpg','work24.jpg','work25.jpg','work30.jpg','work32.jpg','work50.jpg','work51.jpg','work53.jpg','work55.jpg','work59.jpg','work60.jpg','work61.jpg','work66.jpg','work67.jpg','work70.jpg','work74.jpg','work82.jpg','work86.jpg'];
const drawings=['work04.jpg','work05.jpg','work06.jpg','work23.jpg','work31.jpg','work33.jpg','work34.jpg','work35.jpg','work36.jpg','work37.jpg','work38.jpg','work39.jpg','work40.jpg','work41.jpg','work42.jpg','work43.jpg','work44.jpg','work45.jpg','work46.jpg','work47.jpg','work48.jpg','work57.jpg','work58.jpg','work62.jpg'];
function tile(path,title){const f=document.createElement('figure');f.className='tile';const i=document.createElement('img');i.src=path;i.alt=title||'Artwork';i.loading='lazy';i.onclick=()=>openLightbox(i);i.onerror=()=>f.remove();const c=document.createElement('figcaption');c.className='cap';c.textContent=title||'Untitled';f.append(i,c);return f}
function openLightbox(img){const lb=document.getElementById('lb'),im=document.getElementById('lbimg');im.src=img.src;im.alt=img.alt||'Artwork';lb.showModal()}
async function init(){let titles={};try{const r=await fetch('assets/titles.json',{cache:'no-store'});if(r.ok)titles=await r.json()}catch(e){};const wg=document.getElementById('works-grid'),dg=document.getElementById('drawings-grid');works.forEach(n=>wg.append(tile('assets/'+n,titles[n])));drawings.forEach(n=>dg.append(tile('assets/DRAWINGS/'+n,titles[n])));document.getElementById('y').textContent=new Date().getFullYear()}
document.addEventListener('DOMContentLoaded',init)
</script></body></html>
