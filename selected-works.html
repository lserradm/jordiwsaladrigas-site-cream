('work22.jpg'),{id:'el-dorado',cover:'work30.jpg',images:['work24.jpg','work25.jpg','work30.jpg']},single('work32.jpg'),{id:'music-for-penguins',cover:'work50.jpg',images:['work50.jpg','work51.jpg']},{id:'african-music-in-motion',cover:'work53.jpg',images:['work53.jpg','work55.jpg']},{id:'scottish-winter',cover:'work59.jpg',images:['work59.jpg','work60.jpg']},single('work61.jpg'),{id:'death-ii',cover:'work66-black.jpg',images:['work66-black.jpg','work67.jpg']},{id:'cargo-ship',cover:'work70.jpg',images:['work70.jpg','work74.jpg']},{id:'alvar-nunez',cover:'work82.jpg',images:['work82.jpg','work86.jpg']}];const drawings=['work04.jpg','work05.jpg','work06.jpg','work31.jpg','work33.jpg','work34.jpg','work35.jpg','work36.jpg','work37.jpg','work38.jpg','work39.jpg','work40.jpg','work41.jpg','work42.jpg','work43.jpg','work44.jpg','work45.jpg','work46.jpg','work47.jpg','work48.jpg','work57.jpg','work58.jpg','work62.jpg'];function tile(path,title,entry){const f=document.createElement('figure');f.className='tile';const i=document.createElement('img');i.src=path;i.alt=title||'Artwork';i.loading='lazy';i.onerror=()=>f.remove();const c=document.createElement('figcaption');c.className='cap';c.textContent=title||'Untitled';f.append(i,c);if(entry?.id){f.classList.add('series-tile');f.tabIndex=0;f.setAttribute('role','link');f.setAttribute('aria-label',(title||'Untitled')+', '+entry.images.length+' images');const b=document.createElement('span');b.className='series-count';b.textContent=entry.images.length+' images';f.append(b);const go=()=>location.href='work.html?id='+encodeURIComponent(entry.id);f.onclick=go;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}}else{i.onclick=()=>openLightbox(i)}return f}function openLightbox(img){const lb=document.getElementById('lb'),im=document.getElementById('lbimg');im.src=img.src;im.alt=img.alt||'Artwork';lb.showModal()}async function init(){let titles={};try{const r=await fetch('assets/titles.json',{cache:'no-store'});if(r.ok)titles=await r.json()}catch(e){}const wg=document.getElementById('works-grid'),dg=document.getElementById('drawings-grid');works.forEach(e=>wg.append(tile('assets/'+e.cover,titles[e.cover],e)));drawings.forEach(n=>dg.append(tile('assets/DRAWINGS/'+n,titles[n])));document.getElementById('y').textContent=new Date().getFullYear()}document.addEventListener('DOMContentLoaded',init)</script></body></html>
