<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NAVARRO (1982) — Jordi W. Saladrigas</title>
  <link rel="stylesheet" href="styles.css?v=navarro-1">
  <link rel="stylesheet" href="navarro.css?v=navarro-1">
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="index.html">JORDI W. SALADRIGAS<small>Artist</small></a><nav class="menu"><a href="index.html">Home</a><a href="bio.html">Bio</a><a href="selected-works.html">Works</a><a href="drawings.html" class="active">Drawings</a><a href="exhibitions.html">Exhibitions</a><a href="contact.html">Contact</a></nav></div></header>
  <main class="wrap">
    <section class="section navarro-head"><a class="back-link" href="drawings.html">← Back to Drawings</a><h1>NAVARRO</h1><p class="sub">1982 · Select a page to view its vignettes.</p></section>
    <section class="navarro-pages" id="pages" aria-label="NAVARRO pages"></section>
  </main>
  <dialog id="viewer" aria-label="Vignette viewer">
    <div class="viewer-shell">
      <button class="viewer-close" type="button" aria-label="Close viewer">Close</button>
      <button class="viewer-arrow viewer-prev" type="button" aria-label="Previous vignette">←</button>
      <figure class="viewer-figure"><img id="viewer-image" alt=""><figcaption id="viewer-caption"></figcaption></figure>
      <button class="viewer-arrow viewer-next" type="button" aria-label="Next vignette">→</button>
    </div>
  </dialog>
  <footer><div class="wrap">© <span id="y"></span> Jordi W. Saladrigas. All rights reserved.</div></footer>
  <script>
    const pages=[
      ['navarro-p01-v01.jpg'],
      ['navarro-p02-v01.jpg','navarro-p02-v02.jpg','navarro-p02-v03.jpg','navarro-p02-v04.jpg','navarro-p02-v05.jpg','navarro-p02-v06.jpg','navarro-p02-v07.jpg'],
      ['navarro-p03-v01.jpg','navarro-p03-v02.jpg','navarro-p03-v03.jpg','navarro-p03-v04.jpg','navarro-p03-v05.jpg','navarro-p03-v06.jpg','navarro-p03-v07.jpg'],
      ['navarro-p04-v01.jpg','navarro-p04-v02.jpg','navarro-p04-v03.jpg','navarro-p04-v04.jpg','navarro-p04-v05.jpg','navarro-p04-v06.jpg','navarro-p04-v07.jpg','navarro-p04-v08.jpg','navarro-p04-v09.jpg','navarro-p04-v10.jpg','navarro-p04-v11.jpg'],
      ['navarro-p05-v01.jpg','navarro-p05-v02.jpg','navarro-p05-v03.jpg','navarro-p05-v04.jpg','navarro-p05-v05.jpg','navarro-p05-v06.jpg','navarro-p05-v07.jpg','navarro-p05-v08.jpg','navarro-p05-v09.jpg'],
      ['navarro-p06-v01.jpg','navarro-p06-v02.jpg','navarro-p06-v03.jpg','navarro-p06-v04.jpg','navarro-p06-v05.jpg','navarro-p06-v06.jpg'],
      ['navarro-p07-v01.jpg','navarro-p07-v02.jpg','navarro-p07-v03.jpg','navarro-p07-v04.jpg','navarro-p07-v05.jpg','navarro-p07-v06.jpg','navarro-p07-v07.jpg'],
      ['navarro-p08-v01.jpg','navarro-p08-v02.jpg','navarro-p08-v03.jpg','navarro-p08-v04.jpg','navarro-p08-v05.jpg','navarro-p08-v06.jpg','navarro-p08-v07.jpg']
    ];
    const dialog=document.getElementById('viewer'),image=document.getElementById('viewer-image'),caption=document.getElementById('viewer-caption');
    let pageIndex=0,vignetteIndex=0,touchStart=0;
    function render(){const set=pages[pageIndex],file=set[vignetteIndex];image.src='assets/'+file;image.alt='NAVARRO page '+(pageIndex+1)+', vignette '+(vignetteIndex+1);caption.textContent='PAGE '+(pageIndex+1)+' · '+(set.length===1?'FULL PAGE':'VIGNETTE '+(vignetteIndex+1)+' OF '+set.length)}
    function openPage(index){pageIndex=index;vignetteIndex=0;render();dialog.showModal()}
    function move(step){const set=pages[pageIndex];vignetteIndex=(vignetteIndex+step+set.length)%set.length;render()}
    const grid=document.getElementById('pages');
    pages.forEach((set,index)=>{const button=document.createElement('button');button.className='page-tile';button.type='button';button.setAttribute('aria-label','Open page '+(index+1)+', '+set.length+(set.length===1?' view':' vignettes'));const img=document.createElement('img');img.src='assets/navarro-page-'+String(index+1).padStart(2,'0')+'.jpg';img.alt='NAVARRO page '+(index+1);img.loading='lazy';const label=document.createElement('span');label.innerHTML='<strong>PAGE '+(index+1)+'</strong><small>'+(set.length===1?'Full page':set.length+' vignettes')+'</small>';button.append(img,label);button.onclick=()=>openPage(index);grid.append(button)});
    document.querySelector('.viewer-prev').onclick=()=>move(-1);document.querySelector('.viewer-next').onclick=()=>move(1);document.querySelector('.viewer-close').onclick=()=>dialog.close();
    dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
    document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
    dialog.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});dialog.addEventListener('touchend',e=>{const distance=e.changedTouches[0].clientX-touchStart;if(Math.abs(distance)>45)move(distance>0?-1:1)},{passive:true});
    document.getElementById('y').textContent=new Date().getFullYear();
  </script>
</body>
</html>
